<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor de Excel</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <main class="container">
        <h1>Visor de archivos Excel (.xlsx)</h1>
        <p class="subtitle">Sube un archivo y visualiza su contenido en una tabla.</p>

        <form action="/upload" method="post" enctype="multipart/form-data" class="upload-form">
            <input type="file" name="file" accept=".xlsx" required />
            <button type="submit">Subir y mostrar</button>
        </form>

        {% if error %}
            <div class="message error">{{ error }}</div>
        {% endif %}

        {% if filename %}
            <div class="message success">Archivo cargado: <strong>{{ filename }}</strong></div>
        {% endif %}

        {% if table_html %}
            <section class="table-wrapper">
                {{ table_html | safe }}
            </section>
        {% endif %}
    </main>
</body>
</html>
